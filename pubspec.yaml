name: NetherLink
description: "Broadcast a remote server as a local server ."

publish_to: 'none'
version: 4.0.0+22

environment:
  sdk: ^3.8.1
dependencies:
  udp: ^5.0.3
  url_launcher: ^6.3.1
  wakelock_plus: ^1.3.2
  path_provider: ^2.1.5
  http: ^1.4.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  uuid: ^4.5.2
  package_info_plus: ^9.0.0
  font_awesome_flutter: ^11.0.0
  flutter_svg: ^2.2.4
  mc_server_info: ^1.0.0
  connectivity_plus: ^7.1.1
