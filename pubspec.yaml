  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.2
  flutter_web_auth_2: ^4.0.1
  web_socket_channel: ^2.4.0
  share_plus: 10.1.4
  file_picker: ^8.1.7
  shared_preferences: ^2.3.2
  sign_in_with_apple: ^6.1.3
  crypto: ^3.0.6

