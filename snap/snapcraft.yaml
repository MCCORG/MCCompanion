name: mccompanion
version: '4.1.7'
summary: A Minecraft companion app
description: |
  MCCompanion is a feature-rich Minecraft companion application.
  Ping and monitor your servers, browse the wiki, manage skins, and more.

base: core22
grade: stable
confinement: strict

architectures:
  - build-on: amd64

apps:
  mccompanion:
    command: bin/MCCompanion
    extensions: [gnome]
    plugs:
      - network
      - desktop
      - desktop-legacy
      - wayland
      - x11
      - opengl
      - home
      - removable-media

parts:
  mccompanion:
    plugin: dump
    # Download the pre-built Flutter Linux tarball from GitHub Releases.
    source: https://github.com/MCCORG/MCCompanion/releases/latest/download/MCCompanion-linux-x64.tar.gz
    source-type: tar
    # After dump the tarball contents land at the part root; move them to bin/
    organize:
      MCCompanion: bin/MCCompanion
      lib: bin/lib
      data: bin/data
    stage-packages:
      - libgtk-3-0
      - libglib2.0-0
