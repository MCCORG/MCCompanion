app-id: com.mccorg.MCCompanion
runtime: org.gnome.Platform
runtime-version: '47'
sdk: org.gnome.Sdk
command: MCCompanion

finish-args:
  # Wayland + X11 display
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # OpenGL
  - --device=dri
  # Network access (server pinger, wiki, Firebase)
  - --share=network
  # Persistent app data (server list, settings)
  - --filesystem=xdg-data/MCCompanion:create
  # Notifications (local notifications plugin)
  - --talk-name=org.freedesktop.Notifications
  # File picker (import/export world files)
  - --talk-name=org.freedesktop.portal.FileChooser
  # Allow connectivity_plus to communicate with NetworkManager via System D-Bus
  - --socket=system-bus
  - --system-talk-name=org.freedesktop.NetworkManager

modules:
  - name: MCCompanion
    buildsystem: simple
    build-commands:
      # Install the pre-built Flutter bundle produced by 'flutter build linux --release'
      - install -Dm755 MCCompanion /app/bin/MCCompanion
      - cp -r lib /app/bin/lib
      - cp -r data /app/bin/data
      # Desktop entry
      - install -Dm644 com.mccorg.MCCompanion.desktop /app/share/applications/com.mccorg.MCCompanion.desktop
      # App icon (256×256 PNG)
      - install -Dm644 com.mccorg.MCCompanion.png /app/share/icons/hicolor/256x256/apps/com.mccorg.MCCompanion.png
      # AppStream metainfo
      - install -Dm644 com.mccorg.MCCompanion.metainfo.xml /app/share/metainfo/com.mccorg.MCCompanion.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/MCCORG/MCCompanion/releases/download/dev/MCCompanion-linux-x64.tar.gz
        sha256: 39981a793c91400eb627868ccb4e608e765ad41d805feda3861a5f9857a98a43
      - type: file
        path: com.mccorg.MCCompanion.desktop
      - type: file
        path: com.mccorg.MCCompanion.metainfo.xml
      - type: file
        path: com.mccorg.MCCompanion.png
