app-id: net.mccompanion.MCCompanion
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: MCCompanion

finish-args:
  # Wayland + X11 display
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # OpenGL
  - --device=dri
  # Network access (server pinger, wiki, Firebase)
  - --share=network
  # Allow connectivity_plus to communicate with NetworkManager via System D-Bus
  - --system-talk-name=org.freedesktop.NetworkManager
  # Grant access to host Documents folder
  - --filesystem=xdg-documents

modules:
  - name: zenity
    buildsystem: meson
    sources:
      - type: archive
        url: https://download.gnome.org/sources/zenity/4.0/zenity-4.0.1.tar.xz
        sha256: 66e2eda9d5c0b01e787f596b2a69641a27eaa5e87d4ee6140e1f449a10862f53
  - name: MCCompanion
    buildsystem: simple
    build-commands:
      # Install the pre-built Flutter bundle produced by 'flutter build linux --release'
      - install -Dm755 MCCompanion /app/bin/MCCompanion
      - cp -r lib /app/bin/lib
      - cp -r data /app/bin/data
      # Desktop entry
      - install -Dm644 net.mccompanion.MCCompanion.desktop /app/share/applications/net.mccompanion.MCCompanion.desktop
      # App icon (256×256 PNG)
      - install -Dm644 net.mccompanion.MCCompanion.png /app/share/icons/hicolor/256x256/apps/net.mccompanion.MCCompanion.png
      # AppStream metainfo
      - install -Dm644 net.mccompanion.MCCompanion.metainfo.xml /app/share/metainfo/net.mccompanion.MCCompanion.metainfo.xml
    sources:
      - type: archive
        url: https://github.com/MCCORG/MCCompanion/releases/download/dev/MCCompanion-linux-x64.tar.gz
        sha256: 66e2eda9d5c0b01e787f596b2a69641a27eaa5e87d4ee6140e1f449a10862f53
        x-checker-data:
          type: rotating-location
          url: https://github.com/MCCORG/MCCompanion/releases/download/dev/MCCompanion-linux-x64.tar.gz
      - type: file
        url: https://raw.githubusercontent.com/MCCORG/MCCompanion/main/flatpak/net.mccompanion.MCCompanion.metainfo.xml
        sha256: 66e2eda9d5c0b01e787f596b2a69641a27eaa5e87d4ee6140e1f449a10862f53
        dest-filename: net.mccompanion.MCCompanion.metainfo.xml
        x-checker-data:
          type: rotating-location
          url: https://raw.githubusercontent.com/MCCORG/MCCompanion/main/flatpak/net.mccompanion.MCCompanion.metainfo.xml
      - type: file
        url: https://raw.githubusercontent.com/MCCORG/MCCompanion/main/flatpak/net.mccompanion.MCCompanion.desktop
        sha256: 66e2eda9d5c0b01e787f596b2a69641a27eaa5e87d4ee6140e1f449a10862f53
        dest-filename: net.mccompanion.MCCompanion.desktop
        x-checker-data:
          type: rotating-location
          url: https://raw.githubusercontent.com/MCCORG/MCCompanion/main/flatpak/net.mccompanion.MCCompanion.desktop
      - type: file
        url: https://raw.githubusercontent.com/MCCORG/MCCompanion/main/flatpak/net.mccompanion.MCCompanion.png
        sha256: 66e2eda9d5c0b01e787f596b2a69641a27eaa5e87d4ee6140e1f449a10862f53
