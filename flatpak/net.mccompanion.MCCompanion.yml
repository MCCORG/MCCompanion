app-id: net.mccompanion.MCCompanion
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
command: MCCompanion

finish-args:
  # Wayland + X11 display
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # OpenGL
  - --device=dri
  # Network access (server pinger, wiki, Firebase)
  - --share=network
  # Allow connectivity_plus to communicate with NetworkManager via System D-Bus
  - --system-talk-name=org.freedesktop.NetworkManager
  # Grant access to host Documents folder
  - --filesystem=xdg-documents

modules:
  - name: zenity
    buildsystem: meson
    sources:
      - type: archive
        url: https://download.gnome.org/sources/zenity/4.0/zenity-4.0.1.tar.xz
        sha256: 0c2f537813b10f728470d9d05d6c95713db2512f9c95096e1e85b1a6739605e6
  - name: MCCompanion
    buildsystem: simple
    build-options:
      arch:
        x86_64:
          env:
            BUNDLE_PATH: build/linux/x64/release/bundle
        aarch64:
          env:
            BUNDLE_PATH: build/linux/arm64/release/bundle
      append-path: /usr/lib/sdk/llvm22/bin:/var/lib/flutter/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm22/lib
      env:
        PUB_CACHE: /run/build/MCCompanion/.pub-cache
    build-commands:
      - flutter pub get --offline
      - flutter build linux --release --no-pub --build-name=@BUILD_NAME@ --build-number=@BUILD_NUMBER@
      - python3 scripts/set_release_entry.py @BUILD_NAME@ @RELEASE_DATE@
      - install -Dm755 "$BUNDLE_PATH/MCCompanion" /app/bin/MCCompanion
      - cp -r "$BUNDLE_PATH/lib" "$BUNDLE_PATH/data" /app/bin/
      - install -Dm644 flatpak/net.mccompanion.MCCompanion.desktop /app/share/applications/net.mccompanion.MCCompanion.desktop
      - install -Dm644 flatpak/net.mccompanion.MCCompanion.png /app/share/icons/hicolor/256x256/apps/net.mccompanion.MCCompanion.png
      - install -Dm644 flatpak/net.mccompanion.MCCompanion.metainfo.xml /app/share/metainfo/net.mccompanion.MCCompanion.metainfo.xml
    sources:
      - type: git
        url: https://github.com/MCCORG/MCCompanion.git
