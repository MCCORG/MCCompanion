name: Bug Report
description: Report a bug in MCCompanion
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug! Fill in as much as you can.

  - type: input
    id: title
    attributes:
      label: What went wrong?
      placeholder: e.g. App crashes when opening the skin editor
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app
        2. Go to ...
        3. Tap ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Windows
        - macOS
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 1.4.2
