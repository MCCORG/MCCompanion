name: Feature Request
description: Suggest a new feature or improvement
labels: ["feature-request"]
body:
  - type: markdown
    attributes:
      value: Got an idea? We'd love to hear it!

  - type: input
    id: title
    attributes:
      label: What would you like to see?
      placeholder: e.g. Show player ping in the server list
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe your idea
      placeholder: Explain what it should do and why it would be useful.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform this is most relevant for
      options:
        - All platforms
        - Android
        - iOS
        - Windows
        - macOS
    validations:
      required: true
