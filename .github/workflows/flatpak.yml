name: Build & Publish Flatpak

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-flatpak:
    name: Build Flatpak Bundle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake libgtk-3-dev libwebkit2gtk-4.1-dev \
            ninja-build pkg-config \
            flatpak flatpak-builder

      - name: Add Flathub remote
        run: |
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak runtime and SDK
        run: |
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Regenerate Linux Flutter files
        run: flutter create --platforms=linux --project-name mccompanion .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      # Copy the logo as the Flatpak icon so the manifest can find it
      - name: Prepare Flatpak sources
        run: |
          cp assets/images/logo.png flatpak/com.mccorg.MCCompanion.png

      # Patch manifest to use the local build instead of downloading a tarball
      - name: Create local source archive for Flatpak
        run: |
          tar -C build/linux/x64/release -czf /tmp/MCCompanion-linux-x64.tar.gz bundle
          SHA256=$(sha256sum /tmp/MCCompanion-linux-x64.tar.gz | awk '{print $1}')
          # Replace remote url/sha256 with local file reference
          python3 - <<EOF
          import yaml, sys

          with open('flatpak/com.mccorg.MCCompanion.yml') as f:
              data = yaml.safe_load(f)

          for mod in data['modules']:
              for src in mod.get('sources', []):
                  if src.get('type') == 'archive' and 'url' in src:
                      src['type'] = 'archive'
                      del src['url']
                      del src['sha256']
                      del src['x-checker-data']
                      src['path'] = '/tmp/MCCompanion-linux-x64.tar.gz'

          with open('/tmp/com.mccorg.MCCompanion.yml', 'w') as f:
              yaml.dump(data, f, default_flow_style=False)
          EOF

      - name: Build Flatpak bundle
        run: |
          flatpak-builder \
            --user \
            --install-deps-from=flathub \
            --force-clean \
            --repo=/tmp/flatpak-repo \
            /tmp/flatpak-build \
            /tmp/com.mccorg.MCCompanion.yml

          flatpak build-bundle \
            /tmp/flatpak-repo \
            MCCompanion-linux.flatpak \
            com.mccorg.MCCompanion

      - uses: actions/upload-artifact@v6
        with:
          name: linux-flatpak
          path: MCCompanion-linux.flatpak

      - name: Attach Flatpak to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: MCCompanion-linux.flatpak
