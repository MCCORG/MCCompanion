name: Build & Publish Linux Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-flatpak:
    name: Build Flatpak Bundle
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake libgtk-3-dev libwebkit2gtk-4.1-dev \
            ninja-build pkg-config \
            flatpak flatpak-builder

      - name: Add Flathub remote
        run: |
          flatpak remote-add --if-not-exists --user flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak runtime and SDK
        run: |
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Regenerate Linux Flutter files
        run: flutter create --platforms=linux --project-name mccompanion .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      # Copy the logo as the Flatpak icon so the manifest can find it
      - name: Prepare Flatpak sources
        run: |
          cp assets/images/logo.png flatpak/com.mccorg.MCCompanion.png

      # Patch manifest to use the local build instead of downloading a tarball
      - name: Create local source archive for Flatpak
        run: |
          tar -C build/linux/x64/release -czf /tmp/MCCompanion-linux-x64.tar.gz bundle
          # Replace remote url/sha256 with local file reference
          python3 - <<EOF
          import yaml

          with open('flatpak/com.mccorg.MCCompanion.yml') as f:
              data = yaml.safe_load(f)

          for mod in data['modules']:
              for src in mod.get('sources', []):
                  if src.get('type') == 'archive' and 'url' in src:
                      del src['url']
                      del src['sha256']
                      src.pop('x-checker-data', None)
                      src['path'] = '/tmp/MCCompanion-linux-x64.tar.gz'

          with open('/tmp/com.mccorg.MCCompanion.yml', 'w') as f:
              yaml.dump(data, f, default_flow_style=False)
          EOF

      - name: Build Flatpak bundle
        run: |
          flatpak-builder \
            --user \
            --install-deps-from=flathub \
            --force-clean \
            --repo=/tmp/flatpak-repo \
            /tmp/flatpak-build \
            /tmp/com.mccorg.MCCompanion.yml

          flatpak build-bundle \
            /tmp/flatpak-repo \
            MCCompanion-linux.flatpak \
            com.mccorg.MCCompanion

      - uses: actions/upload-artifact@v6
        with:
          name: linux-flatpak
          path: MCCompanion-linux.flatpak

  build-snap:
    name: Build Snap Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake libgtk-3-dev libwebkit2gtk-4.1-dev \
            ninja-build pkg-config

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Regenerate Linux Flutter files
        run: flutter create --platforms=linux --project-name mccompanion .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Archive Linux build for snap
        run: tar -C build/linux/x64/release -czf /tmp/MCCompanion-linux-x64.tar.gz bundle

      # Patch snapcraft.yaml to use the local tarball instead of a remote URL
      - name: Patch snapcraft source to local archive
        run: |
          python3 - <<EOF
          import yaml

          with open('snap/snapcraft.yaml') as f:
              data = yaml.safe_load(f)

          data['parts']['mccompanion']['source'] = '/tmp/MCCompanion-linux-x64.tar.gz'
          data['parts']['mccompanion']['source-type'] = 'tar'

          with open('/tmp/snapcraft.yaml', 'w') as f:
              yaml.dump(data, f, default_flow_style=False)
          EOF
          cp /tmp/snapcraft.yaml snap/snapcraft.yaml

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build snap
        run: snapcraft --destructive-mode

      - name: Rename snap artifact
        run: mv *.snap MCCompanion-linux.snap

      - uses: actions/upload-artifact@v6
        with:
          name: linux-snap
          path: MCCompanion-linux.snap

  release:
    name: Attach to dev Release
    needs: [build-flatpak, build-snap]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-flatpak
          path: artifacts/

      - uses: actions/download-artifact@v8
        with:
          name: linux-snap
          path: artifacts/

      - name: Attach Linux packages to dev release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev
          files: |
            artifacts/MCCompanion-linux.flatpak
            artifacts/MCCompanion-linux.snap

  release-beta:
    name: Attach to beta Release
    needs: [build-flatpak, build-snap]
    if: ${{ needs.build-flatpak.result == 'success' && needs.build-snap.result == 'success' && startsWith(github.event.head_commit.message, '[beta]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-flatpak
          path: artifacts/

      - uses: actions/download-artifact@v8
        with:
          name: linux-snap
          path: artifacts/

      - name: Attach Linux packages to beta release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: beta
          target_commitish: ${{ github.sha }}
          files: |
            artifacts/MCCompanion-linux.flatpak
            artifacts/MCCompanion-linux.snap
