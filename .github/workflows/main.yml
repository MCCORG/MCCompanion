name: Main

# One workflow for everything that lands on main, so there is a single path
# from commit to store and no way to end up half released.
#
# Your commit message decides what happens. Put [patch], [minor] or [major]
# anywhere in the first line and that commit is released. Leave it out and it
# refreshes the rolling dev build instead.
#
#     Fix the crash when a server times out [patch]     4.1.9 -> 4.1.10
#     Warn standalone builds about updates [minor]      4.1.9 -> 4.2.0
#     Drop support for the old relay [major]            4.1.9 -> 5.0.0
#
# On a squash merge the first line is the pull request title, so that is where
# you write it.
#
# The version is worked out from the newest tag, never from a file, so nothing
# has to be committed back to main and branch protection can be as strict as
# you like. The tag is created after the build succeeds, never before, so a tag
# without artifacts behind it cannot exist.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Releases are never cancelled halfway. Two pushes in a row cost two builds,
# which is the right trade when the alternative is a torn release.
concurrency:
  group: main
  cancel-in-progress: false

jobs:
  decide:
    name: Decide what this is
    runs-on: ubuntu-latest
    outputs:
      build-name: ${{ steps.check.outputs.build-name }}
      build-number: ${{ steps.check.outputs.build-number }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history: the build number is the number of commits, and
          # the version comes from the tags.
          fetch-depth: 0

      - name: Read the commit message and the newest tag
        id: check
        env:
          # Through the environment rather than straight into the script. A
          # commit message is text somebody else wrote, and it should never be
          # able to become part of a command.
          MESSAGE: ${{ github.event.head_commit.message }}
          EVENT: ${{ github.event_name }}
        run: |
          SUBJECT="$(printf '%s' "$MESSAGE" | head -n1)"
          LEVEL="$(printf '%s' "$SUBJECT" \
            | grep -oiE '\[(major|minor|patch)\]' \
            | head -n1 | tr -d '[]' | tr 'A-Z' 'a-z' || true)"

          # Every commit is one higher than the last, it never resets, and a
          # force push to main is blocked, so this only ever goes up. The
          # stores refuse anything they have seen before.
          NUMBER="$(git rev-list --count HEAD)"

          LATEST="$(git tag -l 'v*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed 's/^v//' | sort -V | tail -n1)"
          if [ -z "$LATEST" ]; then
            echo "No version tag yet, starting from 0.0.0"
            LATEST="0.0.0"
          fi
          echo "Newest release: $LATEST"

          if [ -z "$LEVEL" ] || [ "$EVENT" != "push" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "build-name=$LATEST" >> "$GITHUB_OUTPUT"
            echo "build-number=$NUMBER" >> "$GITHUB_OUTPUT"
            echo "No [patch], [minor] or [major] in the subject, so this is a dev build."
            exit 0
          fi

          MAJOR="${LATEST%%.*}"
          REST="${LATEST#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"

          case "$LEVEL" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NAME="$MAJOR.$MINOR.$PATCH"

          if git rev-parse -q --verify "refs/tags/v$NAME" >/dev/null; then
            echo "Tag v$NAME already exists, which should be impossible."
            exit 1
          fi

          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "build-name=$NAME" >> "$GITHUB_OUTPUT"
          echo "build-number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "Releasing $NAME+$NUMBER, a $LEVEL up from $LATEST"

  build:
    name: Build
    needs: [decide]
    uses: ./.github/workflows/build-app.yml
    with:
      build-name: ${{ needs.decide.outputs.build-name }}
      build-number: ${{ needs.decide.outputs.build-number }}
      build-aab: ${{ fromJSON(needs.decide.outputs.release) }}
    secrets: inherit

  dev:
    name: Update dev release
    needs: [decide, build]
    if: ${{ needs.decide.outputs.release == 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: dev
          name: Development Build
          prerelease: true
          body: |
            Automated development build of ${{ needs.decide.outputs.build-name }}
            from commit ${{ github.sha }}.
            This is a development build. If you don't know what you are doing,
            please don't install it.
            Warning: Google/Apple authentication won't work with dev builds.
          files: |
            artifacts/MCCompanion-android.apk
            artifacts/MCCompanion-windows.zip
            artifacts/MCCompanion-windows-setup.exe
            artifacts/MCCompanion-macos.dmg
            artifacts/MCCompanion-linux-x64.tar.gz
            artifacts/MCCompanion.msix
            artifacts/MCCompanion-linux.flatpak
            artifacts/MCCompanion-linux.snap

  release:
    name: Publish release
    needs: [decide, build]
    if: ${{ needs.decide.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      # The tag is created here, by this action, on the commit that was built.
      # That is the whole point of the ordering: the build has already passed,
      # so a tag can never point at a version nobody managed to build.
      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.decide.outputs.build-name }}
          target_commitish: ${{ github.sha }}
          name: MCCompanion ${{ needs.decide.outputs.build-name }}
          generate_release_notes: true
          files: |
            artifacts/MCCompanion-android.apk
            artifacts/MCCompanion-android.aab
            artifacts/MCCompanion-windows.zip
            artifacts/MCCompanion-windows-setup.exe
            artifacts/MCCompanion-macos.dmg
            artifacts/MCCompanion-linux-x64.tar.gz
            artifacts/MCCompanion.msix
            artifacts/MCCompanion-linux.flatpak
            artifacts/MCCompanion-linux.snap

  pin:
    name: Build the Flathub manifest
    needs: [decide, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: linux-tarball
          path: /tmp/

      - name: Generate it
        env:
          TAG: v${{ needs.decide.outputs.build-name }}
        run: |
          python3 scripts/set_release_entry.py \
            "${{ needs.decide.outputs.build-name }}" "$(date -u +%Y-%m-%d)"

          python3 scripts/flathub_manifest.py "$TAG" /tmp/MCCompanion-linux-x64.tar.gz \
            > /tmp/net.mccompanion.MCCompanion.yml
          cat /tmp/net.mccompanion.MCCompanion.yml

      # The metadata, the desktop file and the icon go up with it. They are
      # what the manifest pins, and the copy on the branch is not the copy that
      # belongs to this version: the release entry is written during the build.
      # Attaching them keeps every file and its hash in one place, and Flathub
      # never has to reach into the repository.
      - name: Attach the manifest and what it points at
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.decide.outputs.build-name }}
          files: |
            /tmp/net.mccompanion.MCCompanion.yml
            flatpak/net.mccompanion.MCCompanion.metainfo.xml
            flatpak/net.mccompanion.MCCompanion.desktop
            flatpak/net.mccompanion.MCCompanion.png

      # Everything the manifest points at has to be reachable with exactly the
      # hash it claims. This downloads it back and checks, so a mismatch fails
      # here with an explanation instead of in Flathub's build.
      - name: Check the release serves what the manifest pins
        env:
          TAG: v${{ needs.decide.outputs.build-name }}
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          for NAME in metainfo.xml desktop png; do
            FILE="flatpak/net.mccompanion.MCCompanion.$NAME"
            EXPECTED="$(sha256sum "$FILE" | cut -d' ' -f1)"
            ACTUAL="$(curl -fsSL "$BASE/net.mccompanion.MCCompanion.$NAME" | sha256sum | cut -d' ' -f1)"
            if [ "$EXPECTED" != "$ACTUAL" ]; then
              echo "net.mccompanion.MCCompanion.$NAME on the release does not match what the manifest pins."
              exit 1
            fi
            echo "net.mccompanion.MCCompanion.$NAME matches."
          done

  snap:
    name: Upload to the Snap Store
    needs: [decide, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-snap
          path: artifacts/

      # The only store that is genuinely easier to push to from here than by
      # hand: snapcraft does not run properly on macOS, so uploading from a Mac
      # means fighting a container. The others are a web form and stay manual.
      #
      # The channel defaults to edge, which is where the snap has always gone.
      # Set a repository variable SNAP_CHANNEL to stable when you want releases
      # to reach people who install it by searching the store.
      - name: Upload
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          CHANNEL: ${{ vars.SNAP_CHANNEL || 'edge' }}
          VERSION: ${{ needs.decide.outputs.build-name }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "SNAPCRAFT_STORE_CREDENTIALS is not set, so nothing was uploaded."
            echo "The snap is still on the release if you want to push it by hand."
            exit 0
          fi

          sudo snap install snapcraft --classic
          echo "Uploading $VERSION to the $CHANNEL channel."
          snapcraft upload artifacts/MCCompanion-linux.snap --release="$CHANNEL"

  notify:
    name: Notify Discord
    if: ${{ always() }}
    needs: [decide, build, dev, release]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Send build status embed
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BUILD_RESULT: ${{ needs.build.result }}
          PUBLISH_RESULT: ${{ needs.decide.outputs.release == 'true' && needs.release.result || needs.dev.result }}
          KIND: ${{ needs.decide.outputs.release == 'true' && 'Release' || 'Dev build' }}
          VERSION: ${{ needs.decide.outputs.build-name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured. Skipping Discord notification."
            exit 0
          fi

          STATUS="✅ $KIND succeeded"
          COLOR=5763719
          if [ "$BUILD_RESULT" != "success" ] || [ "$PUBLISH_RESULT" != "success" ]; then
            STATUS="❌ $KIND failed"
            COLOR=15548997
          fi

          RUN_URL="$SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID"
          COMMIT_URL="$SERVER_URL/$REPOSITORY/commit/$SHA"
          COMMIT_SUBJECT="$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)"

          PAYLOAD="$(jq -n \
            --arg status "$STATUS" \
            --arg repository "$REPOSITORY" \
            --arg version "$VERSION" \
            --arg actor "$ACTOR" \
            --arg runUrl "$RUN_URL" \
            --arg commitUrl "$COMMIT_URL" \
            --arg sha "$SHA" \
            --arg commitSubject "$COMMIT_SUBJECT" \
            --arg build "$BUILD_RESULT" \
            --arg publish "$PUBLISH_RESULT" \
            --argjson color "$COLOR" \
            '{
              username: "GitHub Actions",
              avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              embeds: [
                {
                  title: $status,
                  color: $color,
                  description: ("**Repository:** `" + $repository + "`\n**Version:** `" + $version + "`\n**Triggered by:** `" + $actor + "`"),
                  fields: [
                    { name: "Build", value: $build, inline: true },
                    { name: "Publish", value: $publish, inline: true },
                    { name: "Commit", value: ("[" + ($sha | .[0:7]) + "](" + $commitUrl + ")" + (if $commitSubject != "" then " " + $commitSubject else "" end)), inline: false }
                  ],
                  url: $runUrl,
                  timestamp: now | todateiso8601
                }
              ]
            }')"

          RESPONSE_FILE="$(mktemp)"
          HTTP_STATUS="$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL" || true)"
          if [ "${HTTP_STATUS:-000}" -lt 200 ] || [ "${HTTP_STATUS:-000}" -ge 300 ]; then
            echo "Failed to send Discord notification. HTTP status: ${HTTP_STATUS:-000}"
            cat "$RESPONSE_FILE"
            exit 1
          fi
          rm -f "$RESPONSE_FILE"
