name: Create new release

# The button version of the three commands documented in release.yml. It bumps
# the version everywhere it is written by hand, commits that, and pushes the
# tag. Pushing the tag is what starts release.yml; nothing is built here.
#
# The tag has to be pushed with a PAT. A tag pushed with the default
# GITHUB_TOKEN never starts another workflow, so release.yml would sit idle and
# the version would be burned without a single artifact coming out of it.

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: Which part of the version goes up.
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

# The pushing is done with the PAT, so the workflow token needs nothing.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check the PAT is configured
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "$PAT_TOKEN" ]; then
            echo "PAT_TOKEN is not set, so the tag would not start release.yml."
            echo "Add a personal access token with repo scope as PAT_TOKEN."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          # The tags are needed to see whether this version was released before.
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Bump the version
        id: bump
        run: |
          python3 scripts/bump_version.py "${{ inputs.bump_type }}"

          # Read the result back from pubspec.yaml rather than parsing it out of
          # the script's log, so a change to that log cannot silently tag the
          # wrong version. This is the same expression release.yml uses.
          VERSION="$(sed -nE "s/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p" pubspec.yaml | head -n1)"
          if [ -z "$VERSION" ]; then
            echo "Could not read the new version back from pubspec.yaml."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists. Delete it first or pick another bump."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pubspec.yaml snap/snapcraft.yaml flatpak/net.mccompanion.MCCompanion.metainfo.xml
          git commit -m "Release v$VERSION"

          # The tag goes out last. If the branch push is rejected because main
          # moved in the meantime, no tag exists yet and nothing was released,
          # so rerunning this workflow is safe.
          git push
          git tag "v$VERSION"
          git push origin "v$VERSION"

          echo "Tagged v$VERSION. Follow the build here:" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ github.server_url }}/${{ github.repository }}/actions/workflows/release.yml" >> "$GITHUB_STEP_SUMMARY"
