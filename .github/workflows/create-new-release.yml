name: Create new release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (patch, minor, major, or x.y.z)'
        required: true
        default: 'patch'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version with script
        id: bump
        run: |
          # Run your script and capture its output
          OUTPUT=$(python3 scripts/bump_version.py ${{ inputs.bump_type }})
          echo "$OUTPUT"
          
          # Extract the new version part after the '->' arrow (e.g., extracts '4.2.1+15' from '4.2.0+14 -> 4.2.1+15')
          NEW_FULL_VERSION=$(echo "$OUTPUT" | awk -F'->' '{print $2}' | xargs)
          # Strip the build number off (+...) to get just the X.Y.Z version for the git tag
          VERSION_ONLY=$(echo "$NEW_FULL_VERSION" | cut -d'+' -f1)
          
          echo "version=$VERSION_ONLY" >> $GITHUB_OUTPUT

      - name: Commit, tag, and push release
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          
          # Stage and commit modified files (pubspec.yaml, snapcraft.yaml, metainfo.xml)
          git add pubspec.yaml snap/snapcraft.yaml flatpak/net.mccompanion.MCCompanion.metainfo.xml
          git commit -m "Release v$VERSION"
          git push

          # Tag and push the new release tag
          git tag "v$VERSION"
          git push origin "v$VERSION"
