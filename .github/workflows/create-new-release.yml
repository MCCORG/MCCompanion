name: Create new release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (patch, minor, major, or x.y.z)'
        required: true
        default: 'patch'

jobs:
  release:
    runs-on: ubuntu-latest

    # Grant write permissions to push commits and tags back to the repository
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fetch full history to ensure tags and commit history are complete
          fetch-depth: 0
          # PAT_TOKEN is required so the pushed tag triggers release.yml
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version with script
        id: bump
        run: |
          # Execute the version bump script using the workflow input
          OUTPUT=$(python3 scripts/bump_version.py ${{ inputs.bump_type }})
          echo "$OUTPUT"
          
          # Extract the new version from the script's output
          NEW_FULL_VERSION=$(echo "$OUTPUT" | awk -F'->' '{print $2}' | xargs)
          VERSION_ONLY=$(echo "$NEW_FULL_VERSION" | cut -d'+' -f1)
          
          echo "version=$VERSION_ONLY" >> $GITHUB_OUTPUT

      - name: Commit, tag, and push release
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          
          # Stage and commit version bump changes
          git add pubspec.yaml snap/snapcraft.yaml flatpak/net.mccompanion.MCCompanion.metainfo.xml
          git commit -m "Release v$VERSION"
          git push

          # Tag and push the new release tag
          git tag "v$VERSION"
          git push origin "v$VERSION"
