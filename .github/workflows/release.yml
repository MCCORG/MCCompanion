name: Release

# Triggered by a version tag, so releasing is a deliberate act and the result
# is immutable. Push to main only ever produces a dev build.
#
#   python3 scripts/bump_version.py patch
#   git commit -am "Release 4.1.8" && git push
#   git tag v4.1.8 && git push origin v4.1.8

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      build-name: ${{ steps.read.outputs.build-name }}
      build-number: ${{ steps.read.outputs.build-number }}
    steps:
      - uses: actions/checkout@v5

      - name: Derive version from the tag
        id: read
        run: |
          NAME="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag $GITHUB_REF_NAME is not a vX.Y.Z version tag."
            exit 1
          fi

          # A mismatch here means the stores would show a different version
          # than the tag claims, so fail before anything is published.
          PUBSPEC="$(sed -nE "s/^version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/p" pubspec.yaml | head -n1)"
          if [ "$NAME" != "$PUBSPEC" ]; then
            echo "Tag says $NAME but pubspec.yaml says $PUBSPEC."
            echo "Run scripts/bump_version.py and commit before tagging."
            exit 1
          fi

          # Play refuses a versionCode it has seen before, and github.run_number
          # restarts at 1 for a new workflow file, so it cannot be used here.
          # bump_version.py increments this on every release.
          NUMBER="$(sed -nE "s/^version: *[0-9]+\.[0-9]+\.[0-9]+\+([0-9]+).*/\1/p" pubspec.yaml | head -n1)"
          if [ -z "$NUMBER" ]; then
            echo "Could not read the build number from pubspec.yaml"
            exit 1
          fi

          echo "build-name=$NAME" >> "$GITHUB_OUTPUT"
          echo "build-number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "Releasing $NAME+$NUMBER"

  build:
    name: Build
    needs: [version]
    uses: ./.github/workflows/build-app.yml
    with:
      build-name: ${{ needs.version.outputs.build-name }}
      build-number: ${{ needs.version.outputs.build-number }}
      build-aab: true
    secrets: inherit

  release:
    name: Publish GitHub release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: MCCompanion ${{ needs.version.outputs.build-name }}
          generate_release_notes: true
          files: |
            artifacts/MCCompanion-android.apk
            artifacts/MCCompanion-windows.zip
            artifacts/MCCompanion-windows-setup.exe
            artifacts/MCCompanion-macos.dmg
            artifacts/MCCompanion-linux-x64.tar.gz
            artifacts/MCCompanion.msix
            artifacts/MCCompanion-linux.flatpak
            artifacts/MCCompanion-linux.snap

      # The website reads releases/tags/beta, so this pointer keeps that page
      # working. The tagged release above is the real, permanent one.
      - name: Move the beta pointer
        uses: softprops/action-gh-release@v3
        with:
          tag_name: beta
          name: Beta Build
          prerelease: true
          body: |
            Beta build of ${{ needs.version.outputs.build-name }}.
            Permanent download: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          files: |
            artifacts/MCCompanion-android.apk
            artifacts/MCCompanion-windows.zip
            artifacts/MCCompanion-windows-setup.exe
            artifacts/MCCompanion-macos.dmg
            artifacts/MCCompanion-linux-x64.tar.gz
            artifacts/MCCompanion.msix
            artifacts/MCCompanion-linux.flatpak
            artifacts/MCCompanion-linux.snap

  # The Flathub manifest points at the published tarball, so its sha256 can
  # only be known once the release above exists. One job, after the fact,
  # instead of two build jobs racing to push the same file.
  flatpak-manifest:
    name: Update Flatpak manifest
    needs: [version, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Point the manifest at the published tarball
        env:
          VERSION: ${{ needs.version.outputs.build-name }}
          TAG: ${{ github.ref_name }}
        run: |
          URL="${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/MCCompanion-linux-x64.tar.gz"
          curl -sL --retry 3 -o /tmp/release.tar.gz "$URL"
          SHA="$(sha256sum /tmp/release.tar.gz | awk '{print $1}')"
          echo "sha256 $SHA"

          python3 - "$URL" "$SHA" <<'PY'
          import re
          import sys
          from pathlib import Path

          url, sha = sys.argv[1], sys.argv[2]
          path = Path("flatpak/net.mccompanion.MCCompanion.yml")
          text = path.read_text()

          # Anchor on our own tarball by name. The zenity module is also a
          # 'type: archive' source and comes first in the file, so a generic
          # pattern rewrites the wrong one.
          pattern = re.compile(
              r"(- type: archive\n\s+url: )\S*MCCompanion-linux-x64\.tar\.gz(\n\s+sha256: )[0-9a-f]+",
          )
          text, count = pattern.subn(rf"\g<1>{url}\g<2>{sha}", text, count=1)
          if count != 1:
              raise SystemExit("Could not find the archive source in the manifest")

          path.write_text(text)
          print("Manifest updated")
          PY

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          branch: main
          commit_message: "chore(flatpak): point manifest at ${{ github.ref_name }} [skip ci]"
          file_pattern: "flatpak/net.mccompanion.MCCompanion.yml"

  play:
    name: Google Play
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-aab
          path: artifacts/

      - name: Check credentials
        id: check
        env:
          KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$KEY" ]; then
            echo "PLAY_SERVICE_ACCOUNT_JSON is not set. Skipping Play upload."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Lands in internal testing, not in front of users. Promoting to
      # production stays a decision you make in the Play Console.
      - name: Upload to internal testing
        if: ${{ steps.check.outputs.ready == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: net.netherdev.netherLink
          releaseFiles: artifacts/MCCompanion-android.aab
          track: internal
          status: completed

  microsoft-store:
    name: Microsoft Store
    needs: [release]
    runs-on: windows-latest
    steps:
      # msstore publish takes the project directory as its argument and finds
      # the package through -i, so the repository has to be present.
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: windows-msix
          path: artifacts/

      - name: Check credentials
        id: check
        shell: bash
        env:
          TENANT: ${{ secrets.MSSTORE_TENANT_ID }}
          CLIENT: ${{ secrets.MSSTORE_CLIENT_ID }}
          SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          SELLER: ${{ secrets.MSSTORE_SELLER_ID }}
          PRODUCT: ${{ secrets.MSSTORE_PRODUCT_ID }}
        run: |
          if [ -z "$TENANT" ] || [ -z "$CLIENT" ] || [ -z "$SECRET" ] || [ -z "$SELLER" ] || [ -z "$PRODUCT" ]; then
            echo "Microsoft Store credentials are incomplete. Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Microsoft Store Developer CLI
        if: ${{ steps.check.outputs.ready == 'true' }}
        uses: microsoft/microsoft-store-apppublisher@v1

      - name: Configure credentials
        if: ${{ steps.check.outputs.ready == 'true' }}
        run: |
          msstore reconfigure \
            --tenantId ${{ secrets.MSSTORE_TENANT_ID }} \
            --sellerId ${{ secrets.MSSTORE_SELLER_ID }} \
            --clientId ${{ secrets.MSSTORE_CLIENT_ID }} \
            --clientSecret ${{ secrets.MSSTORE_CLIENT_SECRET }}

      # The listing itself (description, screenshots, age rating) is managed in
      # Partner Center. This only swaps in the new package.
      - name: Submit MSIX
        if: ${{ steps.check.outputs.ready == 'true' }}
        run: |
          msstore publish . \
            -i artifacts/MCCompanion.msix \
            -id ${{ secrets.MSSTORE_PRODUCT_ID }}

  snap:
    name: Snap Store
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-snap
          path: artifacts/

      - name: Upload to the stable channel
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
            echo "SNAPCRAFT_STORE_CREDENTIALS is not set. Skipping Snap upload."
            exit 0
          fi
          sudo snap install snapcraft --classic
          snapcraft upload artifacts/MCCompanion-linux.snap --release=stable
