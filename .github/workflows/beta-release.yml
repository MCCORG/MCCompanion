name: Beta Release

on:
  workflow_run:
    workflows:
      - Build & Release (dev)
    types:
      - completed

jobs:
  release-beta:
    name: Create or Update beta Release
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_commit.message, '[beta]') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Download workflow artifacts
        run: |
          set -euo pipefail

          mkdir -p artifacts/downloads artifacts/extracted
          ARTIFACTS_JSON="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100")"

          download_artifact() {
            local artifact_name="$1"
            local artifact_id

            artifact_id="$(printf '%s' "$ARTIFACTS_JSON" | jq -r --arg name "$artifact_name" '.artifacts[] | select(.name == $name) | .id' | head -n 1)"
            if [ -z "$artifact_id" ] || [ "$artifact_id" = "null" ]; then
              echo "Artifact '$artifact_name' was not found for workflow run $RUN_ID."
              exit 1
            fi

            curl -fsSL -L \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPOSITORY/actions/artifacts/$artifact_id/zip" \
              -o "artifacts/downloads/$artifact_name.zip"

            unzip -qo "artifacts/downloads/$artifact_name.zip" -d "artifacts/extracted/$artifact_name"
          }

          download_artifact android-apk
          download_artifact windows-zip
          download_artifact macos-dmg

          cp artifacts/extracted/android-apk/app-release.apk artifacts/NetherLink-android.apk
          cp artifacts/extracted/windows-zip/NetherLink-windows.zip artifacts/NetherLink-windows.zip
          cp artifacts/extracted/macos-dmg/NetherLink-macos.dmg artifacts/NetherLink-macos.dmg

      - name: Create or update beta release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: beta
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: Beta Build
          prerelease: true
          body: |
            Automated beta build from commit ${{ github.event.workflow_run.head_sha }} on branch `${{ github.event.workflow_run.head_branch }}`.
            This is a beta build intended for testing before wider release.
          files: |
            artifacts/NetherLink-android.apk
            artifacts/NetherLink-windows.zip
            artifacts/NetherLink-macos.dmg

  notify-discord-beta:
    name: Notify Discord Beta Release
    needs: [release-beta]
    if: ${{ needs.release-beta.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Send beta release embed
        env:
          DISCORD_BETA_WEBHOOK_URL: ${{ secrets.DISCORD_BETA_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.event.workflow_run.actor.login }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SERVER_URL: ${{ github.server_url }}
          BETA_RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/beta
        run: |
          if [ -z "$DISCORD_BETA_WEBHOOK_URL" ]; then
            echo "DISCORD_BETA_WEBHOOK_URL is not configured. Skipping Discord beta notification."
            exit 0
          fi

          ROLE_ID="1485783465365344316"
          RUN_URL="$SERVER_URL/$REPOSITORY/actions/runs/$RUN_ID"
          COMMIT_URL="$SERVER_URL/$REPOSITORY/commit/$SHA"
          COMMIT_SUBJECT="$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)"

          PAYLOAD="$(jq -n \
            --arg roleId "$ROLE_ID" \
            --arg betaReleaseUrl "$BETA_RELEASE_URL" \
            --arg commitUrl "$COMMIT_URL" \
            --arg sha "$SHA" \
            --arg commitSubject "$COMMIT_SUBJECT" \
            --arg runUrl "$RUN_URL" \
            --arg actor "$ACTOR" \
            '{
              content: ("<@&" + $roleId + ">"),
              allowed_mentions: {
                roles: [$roleId]
              },
              username: "GitHub Actions",
              avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              embeds: [
                {
                  title: "🚀 New Beta Release Available",
                  url: $betaReleaseUrl,
                  color: 5793266,
                  description: ("Hello, <@&" + $roleId + ">, we have a new beta release ready. Check it out on our [beta release](" + $betaReleaseUrl + ")."),
                  author: {
                    name: "NetherLink Beta Releases",
                    icon_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png"
                  },
                  fields: [
                    { name: "Commit", value: ("[" + ($sha | .[0:7]) + "](" + $commitUrl + ")" + (if $commitSubject != "" then " " + $commitSubject else "" end)), inline: false },
                    { name: "Platforms", value: "Android • Windows • macOS", inline: true },
                    { name: "Download links", value: ("[Beta release](" + $betaReleaseUrl + ")"), inline: true },
                    { name: "Triggered by", value: $actor, inline: true },
                    { name: "Workflow", value: ("[View run](" + $runUrl + ")"), inline: true }
                  ],
                  footer: {
                    text: "NetherLink beta release"
                  },
                  timestamp: now | todateiso8601
                }
              ]
            }')"

          RESPONSE_FILE="$(mktemp)"
          HTTP_STATUS="$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_BETA_WEBHOOK_URL")"
          CURL_EXIT_CODE=$?
          if [ "$CURL_EXIT_CODE" -ne 0 ]; then
            echo "Failed to send Discord beta release notification with curl exit code: $CURL_EXIT_CODE"
            exit "$CURL_EXIT_CODE"
          fi
          if [ "${HTTP_STATUS:-000}" -lt 200 ] || [ "${HTTP_STATUS:-000}" -ge 300 ]; then
            echo "Failed to send Discord beta release notification. HTTP status: ${HTTP_STATUS:-000}"
            echo "Response body:"
            cat "$RESPONSE_FILE"
            exit 1
          fi
          rm -f "$RESPONSE_FILE"
