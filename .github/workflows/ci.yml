name: CI

# Pull requests and side branches: prove it builds, publish nothing.

# Pull requests only. A branch push used to trigger this as well, so an open
# pull request built every commit twice.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build-app.yml
    with:
      # The version is irrelevant here, nothing is published. run_number keeps
      # it unique so a failure is traceable to one run.
      build-name: 0.0.0
      build-number: ${{ github.run_number }}
      signed: false
    secrets: inherit
